name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml as the gate that runs before anything is published.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            extras: "--all-extras"
          # crewai cannot be imported on 3.14 yet (verified 2026-09-19 with crewai 1.15.22:
          # chromadb's pydantic.v1 models raise ConfigError), so 3.14 covers every other
          # extra. Move it to --all-extras and drop pytest_args once crewai supports 3.14.
          - python: "3.14"
            extras: "--extra langchain --extra google-adk --extra autogen"
            pytest_args: "--ignore=tests/adapters/test_crewai.py"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install
        run: uv sync ${{ matrix.extras }} --group dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      # pyproject.toml pins mypy to the 3.13 floor; check each matrix entry against the
      # interpreter it is actually running on so 3.14 is type-checked as 3.14.
      - name: Type check
        run: uv run mypy --python-version ${{ matrix.python }} matimo_agdk
      - name: Tests
        run: uv run pytest -q ${{ matrix.pytest_args }}

  # Builds the sdist + wheel and proves they are installable, so a broken package is
  # caught on the PR rather than at release time. The artifact uploaded here is exactly
  # what release.yml publishes.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          # Run from outside the checkout so the installed wheel is imported, not ./matimo_agdk.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -c "import matimo_agdk; print('matimo_agdk', matimo_agdk.__version__)"
          "$RUNNER_TEMP/smoke/bin/matimo-agdk" --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
