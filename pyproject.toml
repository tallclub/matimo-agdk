[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matimo-agdk"
version = "0.1.0"
description = "Matimo Agent Governance Development Kit: govern any agent in three lines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "roaiq Technologies" }]
requires-python = ">=3.13"
keywords = ["agent", "governance", "llm", "gateway", "matimo", "agdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic>=2",
]

[project.optional-dependencies]
# Lower bounds reflect the exact versions each adapter was implemented and
# verified against on 2026-09-18 -- not exact
# pins, but not guessed either. An older release may work but was not tested.
langchain = [
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langchain-anthropic>=1.7",
]
google-adk = [
    "google-adk[extensions]>=2.9",
]
crewai = ["crewai>=1.15"]
autogen = [
    "autogen-core>=0.7",
    "autogen-agentchat>=0.7",
    "autogen-ext[openai]>=0.7",
]
all = [
  "matimo-agdk[langchain]",
  "matimo-agdk[google-adk]",
  "matimo-agdk[crewai]",
  "matimo-agdk[autogen]",
]

[project.urls]
Homepage = "https://github.com/tallclub/matimo-agdk"
Repository = "https://github.com/tallclub/matimo-agdk"
Changelog = "https://github.com/tallclub/matimo-agdk/blob/main/CHANGELOG.md"

[project.scripts]
matimo-agdk = "matimo_agdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["matimo_agdk"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  # tests/contract validates SDK requests against the OpenAPI 3.1 spec.
  "jsonschema>=4.18",
  "ruff>=0.6",
  "mypy>=1.10",
  # scripts/live_check.py only -- direct SQL nudges/assertions against the
  # local Postgres when live-verifying against a real Gateway.
  "psycopg[binary]>=3.1",
]

[tool.ruff]
line-length = 100
# ruff >= 0.16 formats Markdown code blocks; the docs are prose, not code.
extend-exclude = ["docs", "*.md"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# scripts/live_check.py is a live-stack verification tool, not shipped
# package code -- its assertion messages are deliberately verbose (they're
# what a human reads when a live run fails), same rationale
# gateway-manual-test.ts's own long assertion strings follow on the UAF side.
"scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # The suite talks to http://testserver; the cleartext-credentials warning is
    # covered by its own test, which asserts it explicitly.
    "ignore:base_url .* is plain http:UserWarning",
]
